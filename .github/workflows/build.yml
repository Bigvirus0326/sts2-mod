name: Build mods

# 바뀐 모드만 빌드합니다. (공통 파일이 바뀌면 전체, 수동 실행 시 선택 가능)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mods:
        description: '빌드할 모드 (쉼표로 구분, 비우면 전체)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.1-stable   # 게임(MegaDot)과 같은 버전이어야 .pck가 로드됨
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.pick.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 바뀐 모드 찾기
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.mods }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT" ]; then
              mods=$(python3 -c "import json,sys;print(json.dumps([m.strip() for m in sys.argv[1].split(',') if m.strip()]))" "$INPUT")
            else
              mods=$(python3 tools/changed_mods.py --all)
            fi
          elif [ "$EVENT" = "pull_request" ]; then
            mods=$(python3 tools/changed_mods.py "$PR_BASE" "$GITHUB_SHA")
          else
            mods=$(python3 tools/changed_mods.py "$BEFORE" "$GITHUB_SHA")
          fi
          echo "빌드 대상: $mods"
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.mods != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.detect.outputs.mods) }}
    name: build (${{ matrix.mod }})
    env:
      MOD: ${{ matrix.mod }}
      DIR: mods/${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 그림 변환 (art/ → images/)
        run: |
          pip install --quiet pillow
          python3 tools/process_art.py "$DIR" --check
          python3 tools/process_art.py "$DIR"

      - name: C# 빌드 (.dll)
        run: |
          set -o pipefail
          if ! dotnet build "$DIR/$MOD.csproj" -c ExportRelease -o "$DIR/build" 2>&1 | tee build.log; then
            # 컴파일 오류를 주석으로 남겨 권한 없이도(폰의 Claude 등) 원인을 볼 수 있게 함
            grep -E "error [A-Z]+[0-9]+" build.log | sed -E 's#^.*/mods/#mods/#' | sort -u | head -40 | while IFS= read -r l; do
              echo "::error title=컴파일 오류 ($MOD)::$l"
            done
            exit 1
          fi

      - name: Godot 캐시
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot 준비
        id: godot
        run: |
          set -e
          dir="$HOME/godot"
          bin=$(find "$dir" -name 'Godot_v*_linux.x86_64' -type f 2>/dev/null | head -1 || true)
          if [ -z "$bin" ]; then
            mkdir -p "$dir"
            curl -sSfL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$dir/godot.zip"
            unzip -q "$dir/godot.zip" -d "$dir" && rm "$dir/godot.zip"
            bin=$(find "$dir" -name 'Godot_v*_linux.x86_64' -type f | head -1)
          fi
          chmod +x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: 에셋 묶기 (.pck)
        run: |
          set -e
          G="${{ steps.godot.outputs.bin }}"
          out="$GITHUB_WORKSPACE/$DIR/build/$MOD.pck"
          touch "$DIR/build/.gdignore"
          "$G" --headless --path "$DIR" --import > godot.log 2>&1 || true
          "$G" --headless --path "$DIR" --export-pack BasicExport "$out" >> godot.log 2>&1 || true
          size=$(stat -c %s "$out" 2>/dev/null || echo 0)
          echo "pck 크기: $size bytes"
          if [ "$size" -lt 1024 ]; then
            # 로그를 주석(annotation)으로 남겨 권한 없이도 원인을 볼 수 있게 함
            msg=$(grep -v "^$" godot.log | tail -25 | tr '\n' '|' | cut -c1-3000)
            echo "::error title=pck 생성 실패 ($MOD)::$msg"
            cat godot.log
            exit 1
          fi

      - name: 설치용 zip 만들기
        run: |
          set -e
          out="dist/$MOD"
          mkdir -p "$out"
          cp "$DIR/build/$MOD.dll" "$DIR/build/$MOD.pck" "$DIR/$MOD.json" "$out/"
          [ -f "$DIR/build/$MOD.pdb" ] && cp "$DIR/build/$MOD.pdb" "$out/" || true
          (cd dist && zip -qr "$MOD.zip" "$MOD")
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: dist/${{ matrix.mod }}/

      - name: Releases의 '<모드>-latest' 갱신 (main일 때)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${MOD}-latest"
          ver=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$DIR/$MOD.json")
          notes="버전 ${ver} · 커밋 ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M UTC')

          설치: zip을 풀어 나온 ${MOD} 폴더를 'Slay the Spire 2/mods/' 에 넣으세요. (BaseLib 모드도 필요)
          또는 PC에서 install.ps1 실행."
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "dist/${MOD}.zip" --title "${MOD} ${ver}" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          # 예전 단일 모드 시절의 'latest' 릴리스 정리
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
